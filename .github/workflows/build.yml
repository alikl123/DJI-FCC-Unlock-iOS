name: Build FreeFCC IPA

on:

  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой в интерфейсе GitHub

jobs:
  build:
    runs-on: macos-14 # Используем сервер на macOS с процессором M-серии

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Обязательно для FreeFCC, так как внутри много субмодулей

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install Dependencies
        run: |
          # Если проект использует CocoaPods, раскомментируйте строку ниже:
          # pod install
          
          # Если FreeFCC требует генерации файлов (например, через скрипты tdesktop/Telegram):
          # chmod +x ./configure.sh && ./configure.sh

      - name: Build Archive
        run: |
          xcodebuild -workspace *.xcworkspace -scheme "FreeFCC" -sdk iphoneos -configuration Release clean archive -archivePath $WORKSPACE/build/FreeFCC.xcarchive CODE_SIGNING_ALLOWED=NO
          # Примечание: Если в проекте нет .xcworkspace, замените "-workspace *.xcworkspace" на "-project *.xcodeproj"

      - name: Create IPA (Unsigned Payload)
        run: |
          mkdir -p Payload
          cp -r $WORKSPACE/build/FreeFCC.xcarchive/Products/Applications/*.app Payload/
          zip -r FreeFCC.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeFCC-Unsigned-IPA
          path: FreeFCC.ipa
