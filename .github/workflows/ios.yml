name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Build Xcode Project
      run: |
        xcodebuild archive \
          -project FreeFCC.xcodeproj \
          -scheme FreeFCC \
          -archivePath $PWD/build/FreeFCC.xcarchive \
          CODE_SIGNING_ALLOWED=NO

    - name: Copy App to Payload
      run: |
        mkdir -p Payload
        cp -r build/FreeFCC.xcarchive/Products/Applications/*.app Payload/
        zip -r FreeFCC.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FreeFCC-Unsigned-IPA
        path: FreeFCC.ipa
